spring.application.name=opensource
spring.ai.mcp.server.name=companyx-mcp-server
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.annotation-scanner.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/companyx}
spring.datasource.username=${DB_USERNAME:companyx}
spring.datasource.password=${DB_PASSWORD:companyx}
spring.datasource.driver-class-name=org.postgresql.Driver

app.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
app.ollama.chat-model=${OLLAMA_CHAT_MODEL:gemma3:latest}

app.ingest.documents.enabled=${INGEST_DOCUMENTS:false}
app.ingest.documents.path=${DOCUMENTS_PATH:/Users/seoyeong/Desktop/companyx-dataset-v1.0/documents}
