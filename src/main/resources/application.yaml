spring:
  application:
    name: opensource

  ai:
    mcp:
      server:
        name: companyx-mcp-server
        version: 0.1.0
        protocol: STREAMABLE
        annotation-scanner:
          enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:companyx}
    username: ${DB_USERNAME:companyx}
    password: ${DB_PASSWORD:companyx}
    driver-class-name: org.postgresql.Driver

server:
  port: ${SERVER_PORT:8080}

app:
  cli:
    enabled: ${APP_CLI_ENABLED:false}
  evaluation:
    enabled: ${APP_EVALUATION_ENABLED:false}
    questions-path: ${APP_EVALUATION_QUESTIONS_PATH:}
    output-path: ${APP_EVALUATION_OUTPUT_PATH:build/reports/companyx-evaluation.md}
  dataset-root: ${DATASET_ROOT:}
  ingest:
    documents:
      enabled: ${INGEST_DOCUMENTS:false}
      path: ${DOCUMENTS_PATH:/Users/seoyeong/Desktop/companyx-dataset-v1.0/documents}
    graph:
      enabled: ${INGEST_GRAPH:false}
      path: ${GRAPH_PATH:/Users/seoyeong/Desktop/companyx-dataset-v1.0/graph}
  documents:
    max-chunk-chars: ${DOCUMENT_CHUNK_MAX_CHARS:2000}
    default-search-limit: ${DOCUMENT_DEFAULT_SEARCH_LIMIT:5}
    max-search-limit: ${DOCUMENT_MAX_SEARCH_LIMIT:20}
    min-similarity: ${DOCUMENT_MIN_SIMILARITY:0.0}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    chat-model: ${OLLAMA_CHAT_MODEL:gemma3:latest}
    embedding-dimension: ${OLLAMA_EMBEDDING_DIMENSION:768}
    connect-timeout-seconds: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:3}
    read-timeout-seconds: ${OLLAMA_READ_TIMEOUT_SECONDS:30}
