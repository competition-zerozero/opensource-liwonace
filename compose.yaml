services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-companyx}
      POSTGRES_USER: ${DB_USERNAME:-companyx}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-companyx}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-companyx} -d ${DB_NAME:-companyx}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
